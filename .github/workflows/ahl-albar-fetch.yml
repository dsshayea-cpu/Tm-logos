name: ahl-albar picture fetch
on:
  push:
    branches: [ahl-albar-work]
    paths: [ahl-albar/titles.json, ahl-albar/fetch.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 ahl-albar/fetch.py
      - run: |
          git config user.name "picture-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ahl-albar
          git commit -m "ahl-albar: fetched picture candidates" || echo nothing
          git push
